<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Missão PMMG</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <header>
      <small>PREPARAÇÃO PESSOAL</small>
      <h1>MISSÃO PMMG</h1>
    </header>

    <main>

      <section class="card">
        <span>🚔 DIA DE PREPARAÇÃO</span>

        <h2>Sua missão começa agora.</h2>

        <p>
          Vamos construir sua preparação para Soldado da PMMG
          começando do absoluto zero.
        </p>
      </section>

      <section class="card">

        <h3>🔥 MISSÃO DE HOJE</h3>

        <h2>📖 Português</h2>

        <p>Interpretação de texto — Fundamentos</p>

        <p>⏱ 30–45 minutos</p>

        <button onclick="comecarEstudo()">
          COMEÇAR ESTUDO
        </button>

      </section>

      <section class="card">

        <h3>🎯 SEU PROGRESSO</h3>

        <div class="barra">
          <div class="progresso"></div>
        </div>

        <p>Preparação iniciada — 1%</p>

      </section>

    </main>

  </div>

  <script src="app.js"></script>

</body>
</html>
